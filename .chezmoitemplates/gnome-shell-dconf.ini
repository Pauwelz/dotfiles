{{- /* Rendered with includeTemplate from run_onchange_after_40-dconf; .laptop adds
       the Gaze lock-screen extension and Teams. */ -}}
[/]
disabled-extensions=['ubuntu-dock@ubuntu.com']
enabled-extensions=['dash-to-panel@jderose9.github.com', 'tailscale-gnome-qs@tailscale-qs.github.io'{{ if .laptop }}, 'gaze@gundulabs.com'{{ end }}]
favorite-apps=['google-chrome.desktop', 'code.desktop', 'com.anthropic.Claude.desktop'{{ if .laptop }}, 'com.github.IsmaelMartinez.teams_for_linux.desktop'{{ end }}, 'org.gnome.Nautilus.desktop']
{{ if .laptop }}
# Face unlock on the GDM lock screen (gaze-gnome-extension). The package ships
# the schema system-wide with this key defaulting to false.
[extensions/gaze]
enable-face-authentication=true
{{ end }}
# Only keys that differ from the dash-to-panel defaults.
# Per-monitor keys are looked up by monitor ID, then by monitor index, so the
# index keys below apply on any machine for up to four monitors. panel-size is
# the legacy global fallback the extension uses for any monitor not listed.
[extensions/dash-to-panel]
appicon-margin=4
context-menu-entries='[{"title":"Terminal","cmd":"TERMINALSETTINGS"},{"title":"System monitor","cmd":"resources"},{"title":"Files","cmd":"nautilus"}]'
global-border-radius=2
panel-lengths='{"0":-1,"1":-1,"2":-1,"3":-1}'
panel-size=32
panel-sizes='{"0":32,"1":32,"2":32,"3":32}'
panel-top-bottom-margins=4
