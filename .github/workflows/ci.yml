name: CI

on:
  push:
  pull_request:

env:
  DESKTOP_PROMPT: "Is this a GNOME desktop (install GUI apps and fonts and apply dconf settings)"
  DEVTOOLS_PROMPT: "Is this a development machine (install Docker plus .NET/Kubernetes/Azure tooling and create a k3d cluster)"
  WORK_EMAIL_PROMPT: "Work email (used for Azure DevOps repos)"
  WORK_EMAIL: ci@example.invalid

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi and shellcheck
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Use this checkout as the chezmoi source directory
        run: |
          mkdir -p "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"

      - name: Cache downloaded externals
        uses: actions/cache@v4
        with:
          path: ~/.cache/chezmoi
          key: chezmoi-externals-${{ hashFiles('.chezmoidata/packages.yaml') }}

      - name: Stub the Bitwarden CLI
        # A fake bw so the hook is a no-op and the SSH-key script can be exercised
        run: |
          cat > "$HOME/.local/bin/bw" <<'EOF'
          #!/bin/bash
          case "$1" in
            status) echo '{"status":"unlocked","serverUrl":"https://vault.bitwarden.eu"}' ;;
            sync) ;;
            list) cat <<'JSON'
          [
            {"type": 1, "name": "some login", "login": {"username": "x"}},
            {"type": 5, "name": "id_ed25519", "sshKey": {"publicKey": "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE", "keyFingerprint": "SHA256:x"}},
            {"type": 5, "name": "Work Key (RSA)", "sshKey": {"publicKey": "ssh-rsa AAAAB3NzaC1yc2EFAKE", "keyFingerprint": "SHA256:y"}}
          ]
          JSON
            ;;
            *) echo "stub bw: unexpected args $*" >&2; exit 1 ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/bw"

      - name: Lint hook and helper scripts
        run: |
          shellcheck .install-password-manager.sh .github/scripts/lint-scripts.sh .github/scripts/update-versions.sh
          bash -n .install-password-manager.sh .github/scripts/lint-scripts.sh .github/scripts/update-versions.sh

      - name: Validate config template
        run: chezmoi execute-template --init --promptBool "$DESKTOP_PROMPT=true" --promptBool "$DEVTOOLS_PROMPT=true" --promptString "$WORK_EMAIL_PROMPT=$WORK_EMAIL" < .chezmoi.toml.tmpl

      # --- Scenario 1: desktop + devtools ---------------------------------------
      - name: Initialise as desktop + devtools
        run: |
          chezmoi init --prompt --promptBool "$DESKTOP_PROMPT=true" --promptBool "$DEVTOOLS_PROMPT=true" --promptString "$WORK_EMAIL_PROMPT=$WORK_EMAIL"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: chezmoi doctor
        run: chezmoi doctor

      - name: Dry-run apply (files and externals, no scripts)
        run: chezmoi apply --dry-run --verbose --exclude=scripts

      - name: Check the work email comes from the init prompt
        run: chezmoi cat ~/.config/git/devops.gitconfig | grep -q "email = $WORK_EMAIL"

      - name: Check the SSH config (desktop)
        run: |
          chezmoi cat ~/.ssh/config | tee /tmp/ssh_config
          grep -q 'IdentityAgent .*bitwarden-ssh-agent.sock' /tmp/ssh_config
          chezmoi managed | grep -qx '.ssh/config.d/github.conf'
          chezmoi managed | grep -qx '.ssh/config.d/azure-devops.conf'

      - name: Run the SSH-key script against the stubbed vault
        # HOME points at a scratch dir so the runner's own ~/.ssh is untouched
        run: |
          chezmoi execute-template < .chezmoiscripts/run_after_65-bitwarden-ssh-keys.sh.tmpl > /tmp/sshkeys.sh
          export HOME=/tmp/fakehome
          mkdir -p "$HOME/.ssh"
          echo 'ssh-ed25519 AAAAexisting existing@host' > "$HOME/.ssh/authorized_keys"
          bash /tmp/sshkeys.sh
          bash /tmp/sshkeys.sh   # second run must be idempotent
          ls -la "$HOME/.ssh"
          cat "$HOME/.ssh/authorized_keys"
          grep -q '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKE.* id_ed25519$' "$HOME/.ssh/id_ed25519.pub"
          grep -q '^ssh-rsa AAAAB3NzaC1yc2EFAKE Work Key (RSA)$' "$HOME/.ssh/work-key--rsa-.pub"
          test "$(grep -c 'existing@host' "$HOME/.ssh/authorized_keys")" -eq 1
          test "$(grep -c 'id_ed25519$' "$HOME/.ssh/authorized_keys")" -eq 1
          test "$(grep -c 'bitwarden ssh keys' "$HOME/.ssh/authorized_keys")" -eq 2
          test "$(stat -c %a "$HOME/.ssh/authorized_keys")" = 600
          test "$(stat -c %a "$HOME/.ssh/id_ed25519.pub")" = 644

      - name: Lint rendered scripts (desktop + devtools)
        run: .github/scripts/lint-scripts.sh

      - name: Check package selection (desktop + devtools)
        run: |
          chezmoi execute-template < .chezmoiscripts/run_onchange_before_10-install-packages.sh.tmpl > /tmp/pkgs.sh
          grep -q 'docker-ce' /tmp/pkgs.sh
          grep -q 'google-chrome' /tmp/pkgs.sh
          grep -q 'tailscale' /tmp/pkgs.sh
          grep -q 'tailscale set --operator' /tmp/pkgs.sh
          ! grep -q 'pipx' /tmp/pkgs.sh
          ! grep -q '{codename}' /tmp/pkgs.sh
          test "$(grep -c 'microsoft-archive-keyring.gpg' /tmp/pkgs.sh)" -ge 2
          chezmoi execute-template < .chezmoiscripts/run_onchange_before_25-remove-packages.sh.tmpl > /tmp/remove.sh
          grep -q 'firefox' /tmp/remove.sh
          grep -q 'ptyxis' /tmp/remove.sh
          chezmoi execute-template < .chezmoiscripts/run_after_45-chrome-policies.sh.tmpl > /tmp/chrome.sh
          grep -q '/etc/opt/chrome/policies/managed/managed_policies.json' /tmp/chrome.sh

      - name: Show rendered fish config
        run: chezmoi cat ~/.config/fish/config.fish

      - name: Check managed files (desktop + devtools)
        run: |
          chezmoi managed | tee /tmp/managed.txt
          ! grep -qE '^(README.md|\.github)' /tmp/managed.txt
          grep -q '^\.local/bin/kubectl$' /tmp/managed.txt
          grep -q '^\.config/k3d/dev.yaml$' /tmp/managed.txt
          grep -qx '.local/share/gnome-shell/extensions/dash-to-panel@jderose9.github.com/metadata.json' /tmp/managed.txt
          grep -qx '.local/share/gnome-shell/extensions/tailscale-gnome-qs@tailscale-qs.github.io/metadata.json' /tmp/managed.txt
          grep -qx '.local/share/just-the-browser/chrome-managed_policies.json' /tmp/managed.txt
          chezmoi cat ~/.local/share/just-the-browser/chrome-managed_policies.json | jq -e '.GeminiSettings == 1' > /dev/null

      # --- Scenario 2: devtools only (headless devbox) --------------------------
      - name: Re-initialise as devtools only
        run: |
          chezmoi init --prompt --promptBool "$DESKTOP_PROMPT=false" --promptBool "$DEVTOOLS_PROMPT=true" --promptString "$WORK_EMAIL_PROMPT=$WORK_EMAIL"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Lint rendered scripts (devtools only)
        run: .github/scripts/lint-scripts.sh 20 25 35 40 45 50

      - name: Check package selection and managed files (devtools only)
        run: |
          chezmoi execute-template < .chezmoiscripts/run_onchange_before_10-install-packages.sh.tmpl > /tmp/pkgs.sh
          grep -q 'docker-ce' /tmp/pkgs.sh
          ! grep -q 'google-chrome' /tmp/pkgs.sh
          ! grep -q 'snap install' /tmp/pkgs.sh
          chezmoi managed | tee /tmp/managed.txt
          ! grep -qE '^\.config/ghostty|^\.local/share/fonts|gnome-shell/extensions|just-the-browser' /tmp/managed.txt
          grep -q '^\.local/bin/k3d$' /tmp/managed.txt
          chezmoi cat ~/.config/fish/config.fish | grep -q DOTNET_NOLOGO
          chezmoi apply --dry-run --verbose --exclude=scripts

      # --- Scenario 3: neither (server / WSL) -----------------------------------
      - name: Re-initialise as a plain machine
        run: |
          chezmoi init --prompt --promptBool "$DESKTOP_PROMPT=false" --promptBool "$DEVTOOLS_PROMPT=false" --promptString "$WORK_EMAIL_PROMPT=$WORK_EMAIL"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Lint rendered scripts (plain)
        run: .github/scripts/lint-scripts.sh 20 25 35 40 45 50 60 70

      - name: Check package selection and managed files (plain)
        run: |
          chezmoi execute-template < .chezmoiscripts/run_onchange_before_10-install-packages.sh.tmpl > /tmp/pkgs.sh
          ! grep -q 'docker-ce' /tmp/pkgs.sh
          ! grep -q 'google-chrome' /tmp/pkgs.sh
          grep -q 'tailscale' /tmp/pkgs.sh
          ! grep -q 'tailscale set --operator' /tmp/pkgs.sh
          grep -q '"fish"' /tmp/pkgs.sh
          grep -q '"jq"' /tmp/pkgs.sh
          chezmoi managed | tee /tmp/managed.txt
          ! grep -qE '^\.config/ghostty|^\.local/share/fonts|^\.local/bin/|^\.config/k3d|gnome-shell/extensions' /tmp/managed.txt
          grep -qx '.ssh/config' /tmp/managed.txt
          grep -qx '.ssh/config.d/azure-devops.conf' /tmp/managed.txt
          ! chezmoi cat ~/.ssh/config | grep -q IdentityAgent
          chezmoi apply --dry-run --verbose
